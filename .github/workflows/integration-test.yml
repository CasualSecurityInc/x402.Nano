name: Integration Tests (Mainnet)

# Manual trigger only - these tests spend real XNO
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run" to confirm (spends real XNO)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration-test:
    # Require approval via environment protection rules
    environment: integration-test
    runs-on: ubuntu-24.04
    
    # Only run if user typed "run" to confirm
    if: ${{ github.event.inputs.confirm == 'run' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        env:
          NANO_TEST_SEED: ${{ secrets.NANO_TEST_SEED }}
          NANO_RPC_URL: ${{ secrets.NANO_RPC_URL }}
        run: pnpm test:integration
